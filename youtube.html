<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTbube Clone</title>

    <link rel="stylesheet" href="styles/video.css">
</head>
<body>

    <!-- 1-video box -->
    <div class="box">
        <div>
            <img src="thumnail-photos/thumbnail-1.webp" alt="thumbnail-1" class="thumbnail">
        </div>
        <div class="video-info">
            <div class="channel-photo-box">
                <img src="channel-photos/channel-1.jpeg" alt="channel-1" class="channel-photo">
            </div>
            <div class="video-info-box">
                <div>
                    <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
                </div>
                <div>
                    <p class="channel-author">Marques Brownlee</p>
                </div>
                <div>
                    <p class="video-stat">3.4M views • 6 months ago</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
